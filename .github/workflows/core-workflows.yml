name: Core workflows

on:
  push:
    branches: [main]
    paths: ['frontend/**', 'backend/**', '.github/workflows/core-workflows.yml']
  pull_request:
    paths: ['frontend/**', 'backend/**', '.github/workflows/core-workflows.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.8
          python-version: '3.13'
      - run: pnpm --dir frontend install --ignore-workspace --frozen-lockfile
      - run: uv sync --directory backend --frozen
      - run: pnpm --dir frontend exec playwright install --with-deps chromium
      - run: pnpm --dir frontend test
      - run: pnpm --dir frontend lint
      - run: pnpm --dir frontend build
        env:
          INDIGOQ_STATIC_EXPORT: '1'
          NEXT_PUBLIC_API_URL: ''
      - run: pnpm --dir frontend test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: core-workflow-traces
          path: frontend/test-results/
          if-no-files-found: ignore
