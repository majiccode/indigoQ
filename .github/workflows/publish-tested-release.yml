name: Publish tested release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Release workflow run containing tested packages
        required: true
      tag:
        description: Existing version tag
        required: true
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source build
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          TAG: ${{ inputs.tag }}
        run: |
          gh run view "$RUN_ID" --json headSha,headBranch,workflowName,jobs > run.json
          node -e "const r=require('./run.json'); if(r.workflowName!=='Release'||r.headBranch!==process.env.TAG) throw Error('Wrong source run'); const builds=r.jobs.filter(j=>j.name==='docker'||j.name.startsWith('packages (')); if(builds.length!==5||builds.some(j=>j.conclusion!=='success')) throw Error('Builds did not all pass');"
          test "$(git rev-list -n 1 "$TAG")" = "$(jq -r .headSha run.json)"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: packages-*
          path: artifacts
          merge-multiple: true
      - name: Publish packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          node scripts/prepare-release.mjs
          gh release create "$TAG" --draft --verify-tag --title "indigoQ $TAG" --generate-notes
          gh release upload "$TAG" release/*
          gh release edit "$TAG" --draft=false
