name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-arm64
            arch: arm64
          - os: macos-15-intel
            arch: x64
          - os: windows-2022
            arch: x64
          - os: ubuntu-22.04
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.8
          python-version: '3.13'
      - name: Validate release version and runner architecture
        shell: bash
        run: |
          node -e "const p=require('./package.json'); if(process.arch!=='${{ matrix.arch }}') throw Error('Wrong runner architecture'); if(process.env.GITHUB_REF_TYPE==='tag' && process.env.GITHUB_REF_NAME!=='v'+p.version) throw Error('Version mismatch')"
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2 libgtk-3-0 libnss3 libasound2 xvfb
      - name: Build and check
        run: node scripts/build.mjs --check --desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ github.token }}
      - name: Test frozen server
        run: node scripts/smoke-test.mjs
      - name: Test desktop on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run -a node scripts/desktop-smoke.mjs
      - name: Test desktop on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: node scripts/desktop-smoke.mjs
      - name: Test desktop on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node scripts/desktop-smoke.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/desktop/*.dmg
            dist/desktop/*.zip
            dist/desktop/*.exe
            dist/desktop/*.AppImage
            dist/desktop/*.tar.gz
            dist/*-server.zip
            dist/*-server.tar.gz
          if-no-files-found: error

  docker:
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build native smoke-test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: indigoq:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test Docker image
        run: |
          docker run -d --name indigoq-test -p 127.0.0.1:8787:8787 indigoq:test
          trap 'docker logs indigoq-test; docker rm -f indigoq-test' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/health; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8787/ > /dev/null
          curl -fsS 'http://127.0.0.1:8787/workspace/?id=test' > /dev/null
          curl -fsS -X PUT -H 'Content-Type: application/json' --data '{"workspaces":[],"wires":[]}' http://127.0.0.1:8787/api/graph
          docker exec indigoq-test test -f /data/graph.json
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/majiccode/indigoq
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
      - name: Build multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags || 'indigoq:validation' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [packages, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: release
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp compose.yaml docs/INSTALL.md release/
          (cd release && sha256sum * > ../SHA256SUMS.txt)
          mv SHA256SUMS.txt release/
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' > draft-status; then
            test "$(cat draft-status)" = true || { echo 'Release already published; choose a new version.'; exit 1; }
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "indigoQ $GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
