name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            arch: arm64
          - os: macos-15-intel
            arch: x64
          - os: windows-2022
            arch: x64
          - os: ubuntu-22.04
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.8
          python-version: '3.13'
      - name: Validate release version and runner architecture
        shell: bash
        run: |
          node -e "const p=require('./package.json'); if(process.arch!=='${{ matrix.arch }}') throw Error('Wrong runner architecture'); if(process.env.GITHUB_REF_TYPE==='tag' && process.env.GITHUB_REF_NAME!=='v'+p.version) throw Error('Version mismatch')"
      - name: Build and check
        run: node scripts/build.mjs --check
      - name: Test frozen server
        run: node scripts/smoke-test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*-server.zip
            dist/*-server.tar.gz
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/prepare-release.mjs
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' > draft-status; then
            test "$(cat draft-status)" = true || { echo 'Release already published; choose a new version.'; exit 1; }
          else
            notes=$(cat <<'EOF'
          ## Run without installing dependencies

          macOS or Linux:

          ```sh
          curl -fsSL https://github.com/majiccode/indigoQ/releases/latest/download/install.sh | sh
          indigoq
          ```

          Windows PowerShell:

          ```powershell
          irm https://github.com/majiccode/indigoQ/releases/latest/download/install.ps1 | iex
          indigoq
          ```

          Then open <http://127.0.0.1:8787>. See `INSTALL.md` for manual downloads, data locations, and Ollama setup.
          EOF
          )
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "indigoQ $GITHUB_REF_NAME" --generate-notes --notes "$notes"
          fi
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
