[project]
name = "indigoq-api"
version = "0.1.5"
description = "Graph persistence API for the indigoQ infinite workspace canvas."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.0,<1.0.0",
    "httpx>=0.28.0,<1.0.0",
    "pydantic>=2.11.0,<3.0.0",
    "python-multipart>=0.0.20,<0.1.0",
    "uvicorn[standard]>=0.35.0,<1.0.0",
]

[dependency-groups]
packaging = ["pyinstaller>=6.16.0,<7.0.0"]
dev = [
    "httpx>=0.28.0,<1.0.0",
    "pytest>=8.3.0,<9.0.0",
    "ruff>=0.12.0,<1.0.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
